<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #1a4d2e; padding: 20px; color: #333; display: flex; flex-direction: column; align-items: center; }

    /* Blackboard Header Style مطابق للصورة */
    .blackboard {
        width: 850px;
        background: #2d5a27;
        border: 12px solid #5a3818;
        border-radius: 8px;
        padding: 15px 10px;
        text-align: center;
        color: white;
        margin-bottom: 20px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    /* العلم الجزائري */
    .flag {
        width: 80px;
        height: 50px;
        background: linear-gradient(90deg, #006233 50%, #fff 50%);
        border: 1px solid #000;
        position: relative;
        box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }
    .flag::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        width: 50%;
        height: 100%;
        background: #fff;
    }
    .flag .crescent-star {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-left-color: #d21034;
    }
    .flag .star {
        position: absolute;
        left: 56%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #d21034;
        font-size: 13px;
    }

    /* نص العنوان بالتنسيق المطلوب */
    .title-area { flex-grow: 1; font-family: 'Amiri', serif; }
    .title-area h1 { font-size: 30px; margin: 0; text-shadow: 0 0 10px #fff, 0 0 20px #ffeb3b; color: #ffffff; letter-spacing: 0.5px; }
    .title-area h2 { font-size: 18px; margin: 8px 0 0 0; color: #ffeb3b; font-weight: bold; }

    /* Form Section Style */
    .form-container { width: 830px; background: white; padding: 25px; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .section-header { background-color: #4b3621; color: white; padding: 8px 12px; margin-top: 20px; font-weight: bold; border-radius: 3px; font-size: 16px; }

    label { display: block; margin-bottom: 5px; font-weight: bold; margin-top: 12px; color: #2c3e50; }
    select, input { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    select:focus, input:focus { border-color: #27ae60; outline: none; box-shadow: 0 0 5px rgba(39, 174, 96, 0.3); }

    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    button:hover { background-color: #219150; }

    /* Footer Style */
    .footer { width: 850px; text-align: center; margin-top: 20px; color: #ecf0f1; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <!-- لوحة العنوان الرسمية المطابقة تماماً لما طلبته -->
  <div class="blackboard">
    <div class="flag">
        <div class="crescent-star"></div>
        <div class="star">★</div>
    </div>
    <div class="title-area">
        <h1>منصة حجز الدروس التطبيقية لامتحان الترسيم</h1>
        <h2>مفتشية التعليم الابتدائي لدائرة حد الصحاري - المقاطعة التربوية الأولى</h2>
    </div>
    <div class="flag">
        <div class="crescent-star"></div>
        <div class="star">★</div>
    </div>
  </div>

  <div class="form-container">
    <form id="inspectorForm">
        <div class="section-header">المؤسسة</div>
        <label>اختر اسم مؤسستك *</label>
        <select name="school" required>
            <option value="">...</option>
            <option>ابتدائية طارق بن زياد</option>
            <option>ابتدائية بن عثمـان الشيخ</option>
            <option>ابتدائية زيوش محمد</option>
            <option>ابتدائية نوع ب حدّ الصّحاري</option>
            <option>ابتدائية عكار أحمد</option>
            <option>ابتدائية المجاهد قويدري خليفة</option>
            <option>ابتدائية نمط 2 حي 165 مسكن</option>
            <option>ابتدائية العقيد عميروش</option>
            <option>ابتدائية الشيخ المختار خليفة</option>
            <option>ابتدائية الصقيعة</option>
            <option>ابتدائية اولاد سي عمر</option>
            <option>ابتدائية وادي بوعيشة</option>
            <option>ابتدائية حاسي الدهيم</option>
            <option>ابتدائية المجمع المدرسي الجديد</option>
            <option>ابتدائية وادي بوتشيشة</option>
            <option>ابتدائية حي المخرج الغربي</option>
        </select>

        <div class="section-header">معلومات الأستاذ(ة)</div>
        <label>لقب واسم الأستاذ(ة) *</label>
        <input type="text" name="teacherName" required>

        <label>المستوى المسند *</label>
        <select name="level" required>
            <option value="">...</option>
            <option>تربية تحضيرية</option>
            <option>أولى ابتدائي</option>
            <option>س1+س2</option>
            <option>س1+س2+س3</option>
            <option>س1+س3</option>
            <option>ثانية ابتدائي</option>
            <option>ثالثة ابتدائي</option>
            <option>س3+س4+س5</option>
            <option>رابعة ابتدائي</option>
            <option>س4+س5</option>
            <option>خامسة ابتدائي</option>
        </select>

        <div class="section-header">تفاصيل الدروس والأنشطة</div>

        <div class="row">
            <div><label>النشاط(1):</label><input type="text" name="activity1"></div>
            <div><label>ومحتواه:</label><input type="text" name="content1"></div>
        </div>
        <div class="row">
            <div><label>النشاط(2):</label><input type="text" name="activity2"></div>
            <div><label>ومحتواه:</label><input type="text" name="content2"></div>
        </div>
        <div class="row">
            <div><label>النشاط(3):</label><input type="text" name="activity3"></div>
            <div><label>ومحتواه:</label><input type="text" name="content3"></div>
        </div>

        <button type="button" onclick="submitForm()">حفظ البيانات</button>
    </form>
  </div>

  <!-- التذييل مع حقوق الملكية المطلوبة -->
  <div class="footer">
    تصميم الأستاذ والمفتش: بلعدل محمد &nbsp;|&nbsp; كل الحقوق محفوظة 2027 ©
  </div>

  <!-- كود الإرسال المحدث بالرابط الجديد -->
  <script>
    function submitForm() {
      var form = document.getElementById('inspectorForm');

      var formData = {
        school: form.querySelector('[name="school"]').value,
        teacherName: form.querySelector('[name="teacherName"]').value,
        level: form.querySelector('[name="level"]').value,
        activity1: form.querySelector('[name="activity1"]').value,
        content1: form.querySelector('[name="content1"]').value,
        activity2: form.querySelector('[name="activity2"]').value,
        content2: form.querySelector('[name="content2"]').value,
        activity3: form.querySelector('[name="activity3"]').value,
        content3: form.querySelector('[name="content3"]').value
      };

      // رابط الـ Web App الجديد
      var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwrm6CTMR7t1JT7cS5XB71jKyMudzKzH_P_anT23w7j1MQWnBIsdVOOJE7I_KL-pQbx/exec";

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      })
      .then(response => {
        alert('تم حفظ البيانات بنجاح في المنصة!');
        form.reset();
      })
      .catch(error => {
        console.error('Error!', error);
        alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
      });
    }
  </script>
</body>
</html>
